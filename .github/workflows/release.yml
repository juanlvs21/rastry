name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Generate and commit release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The tag must use the vMAJOR.MINOR.PATCH format."
          }

          git fetch origin --tags
          $releaseDate = (git log -1 --format=%cs $env:TAG_NAME).Trim()
          $previousTag = @(git tag --sort=-version:refname | Where-Object {
            $_ -match '^v\d+\.\d+\.\d+$' -and $_ -ne $env:TAG_NAME
          } | Select-Object -First 1)

          if ($previousTag.Count -gt 0) {
            bun run release:changelog -- $version --from $previousTag[0] --to $env:TAG_NAME --date $releaseDate --write
          } else {
            bun run release:changelog -- $version --to $env:TAG_NAME --date $releaseDate --write
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json "apps/web/src/content/releases/$version.md"
          $stagedFiles = @(git diff --cached --name-only)
          if ($stagedFiles.Count -eq 0) {
            Write-Host "Release metadata is already current."
          } else {
            git commit -m "chore(docs): prepare release $version"
            git push origin "HEAD:$env:DEFAULT_BRANCH"
          }

  checks:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

  build:
    name: Build ${{ matrix.name }}
    needs: [checks, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag on Unix
        if: runner.os != 'Windows'
        id: version_unix
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RASTRY_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate tag on Windows
        if: runner.os == 'Windows'
        id: version_windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'The tag must use the vMAJOR.MINOR.PATCH format.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "RASTRY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build CLI for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets apps/cli/dist
          define="BUILD_VERSION=\"$RASTRY_VERSION\""
          bun build --compile --minify --target=bun-linux-x64 --define "$define" apps/cli/src/index.ts --outfile apps/cli/dist/rastry
          apps/cli/dist/rastry --version
          tar -czf release-assets/rastry-linux-x64-cli.tar.gz -C apps/cli/dist rastry

      - name: Build CLI for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets apps/cli/dist
          arch="$(uname -m)"
          if [[ "$arch" == "arm64" ]]; then
            target="bun-darwin-arm64"
          elif [[ "$arch" == "x86_64" ]]; then
            target="bun-darwin-x64"
          else
            echo "Unsupported macOS architecture: $arch" >&2
            exit 1
          fi
          define="BUILD_VERSION=\"$RASTRY_VERSION\""
          bun build --compile --minify --target="$target" --define "$define" apps/cli/src/index.ts --outfile apps/cli/dist/rastry
          apps/cli/dist/rastry --version
          tar -czf release-assets/rastry-macos-cli.tar.gz -C apps/cli/dist rastry

      - name: Build CLI for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets, apps/cli/dist | Out-Null
          $define = 'BUILD_VERSION="' + $env:RASTRY_VERSION + '"'
          bun build --compile --minify --target=bun-windows-x64 --define $define apps/cli/src/index.ts --outfile apps/cli/dist/rastry.exe
          & apps/cli/dist/rastry.exe --version
          Compress-Archive -Path apps/cli/dist/rastry.exe -DestinationPath release-assets/rastry-windows-x64-cli.zip -Force

      - name: Build desktop application on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bun run build:desktop

      - name: Build desktop application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run build:desktop

      - name: Package Windows desktop installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path 'apps/desktop/build', 'apps/desktop/artifacts' -Filter 'Rastry-Setup.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $setup) {
            throw 'Electrobun did not produce Rastry-Setup.exe.'
          }
          Copy-Item $setup.FullName 'release-assets/rastry-windows-x64-desktop-setup.exe' -Force

      - name: Package macOS desktop installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/build apps/desktop/artifacts -type d -name 'Rastry.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$app_path" ]]; then
            echo "Electrobun did not produce Rastry.app." >&2
            exit 1
          fi
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp -R "$app_path" "$staging/Rastry.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Rastry $RASTRY_VERSION" -srcfolder "$staging" -ov -format UDZO "release-assets/rastry-macos-desktop.dmg"

      - name: Package Linux desktop installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          launcher="$(find apps/desktop/build apps/desktop/artifacts -type f -path '*/bin/launcher' -print -quit 2>/dev/null || true)"
          if [[ -z "$launcher" ]]; then
            echo "Electrobun did not produce the Linux desktop launcher." >&2
            exit 1
          fi
          app_path="$(dirname "$(dirname "$launcher")")"
          bun run scripts/package-linux-deb.ts "$app_path" "release-assets/rastry-linux-x64-desktop.deb" "$RASTRY_VERSION"

      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [build, prepare]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Generate release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(printf '%s' "$TAG_NAME" | sed 's/^v//')"
          release_date="$(git log -1 --format=%cs "$TAG_NAME")"
          previous_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fvx "$TAG_NAME" | head -n 1 || true)"
          printf '# Rastry %s\n\n' "$version" > release-notes.md
          if [[ -n "$previous_tag" ]]; then
            bun run release:changelog -- "$version" --from "$previous_tag" --to "$TAG_NAME" --date "$release_date" --notes >> release-notes.md
          else
            bun run release:changelog -- "$version" --to "$TAG_NAME" --date "$release_date" --notes >> release-notes.md
          fi
          cat >> release-notes.md <<EOF

          ## Downloads

          The CLI and Desktop installers are standalone binaries. Bun is not required on end-user machines.

          - Windows CLI: rastry-windows-x64-cli.zip
          - macOS CLI: rastry-macos-cli.tar.gz
          - Linux CLI: rastry-linux-x64-cli.tar.gz
          - Windows Desktop: rastry-windows-x64-desktop-setup.exe
          - macOS Desktop: rastry-macos-desktop.dmg
          - Linux Desktop: rastry-linux-x64-desktop.deb

          After installing the CLI binary, run rastry --help or rastry --version.
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(printf '%s' "$TAG_NAME" | sed 's/^v//')"

          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$REPOSITORY" --title "Rastry $version" --notes-file release-notes.md --draft=false --prerelease=false
            gh release upload "$TAG_NAME" --repo "$REPOSITORY" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" --repo "$REPOSITORY" release-assets/* --verify-tag --title "Rastry $version" --notes-file release-notes.md
          fi

          gh release view "$TAG_NAME" --repo "$REPOSITORY" --json tagName,isDraft,isPrerelease,assets --jq '.tagName + " draft=" + (.isDraft | tostring) + " prerelease=" + (.isPrerelease | tostring) + " assets=" + ((.assets | length) | tostring)'
